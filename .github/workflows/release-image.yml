name: Release image
# Publishes ghcr.io/<owner>/backlogr:<version> and :latest when a v* tag is pushed.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          image="ghcr.io/${OWNER,,}/backlogr"
          version="${TAG#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.version=$version" -t "$image:$version" -t "$image:latest" .
          docker push "$image:$version"
          docker push "$image:latest"
