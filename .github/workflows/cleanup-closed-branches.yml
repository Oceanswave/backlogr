name: Clean up closed PR branches
# delete_branch_on_merge handles merged PRs; this deletes same-repo branches of PRs closed without merging.
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${BRANCH}" || echo "branch already gone"
