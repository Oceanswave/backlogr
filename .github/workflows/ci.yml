name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # GitHub-hosted only: this is a public repository, so pull requests from forks must never reach a self-hosted runner.
    uses: Oceanswave/github-workflows/.github/workflows/python-ci.yml@574bd0ee6560592261bd75132dd0fdb56b9e6711 # main
    with:
      runs-on: '"ubuntu-latest"'
      python-version: '3.12'
      install-args: -e .[test] shellcheck-py
      test-command: |
        shellcheck scripts/*.sh ensure.sh
        python -m py_compile cli.py core.py server.py dashboard.py
        python -m pytest -q tests
        if grep -rnE 'TASKS?_(DB|PORT|HOSTS|TOKEN|URL|EXPORT|BACKUP)|task-manager|Task Manager|bot-team-tasks|/workspace/|/cursor/stores' --include='*.py' --include='*.sh' --include='*.service' --include='*.toml' --include='*.md' --include='*.example' --exclude=MIGRATION.md --exclude-dir=.github . ; then echo "legacy name found"; exit 1; fi
  container:
    # Builds the image and smoke-tests it: health, auth and one write through the JSON API.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t backlogr:ci .
      - name: Smoke test
        run: |
          token=$(openssl rand -hex 24)
          docker run -d --name backlogr -p 127.0.0.1:8796:8796 -e BACKLOGR_TOKEN="$token" backlogr:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8796/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8796/api/list -d '{}')" = 401
          auth=(-H "Authorization: Bearer $token" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" -X POST http://127.0.0.1:8796/api/create \
            -d '{"title":"container smoke","owner_bot":"ci","source":"bot_initiated","actor":"ci"}'
          curl -fsS "${auth[@]}" -X POST http://127.0.0.1:8796/api/list -d '{}' | grep -q 'container smoke'
          docker exec backlogr id -u | grep -qx 10001
          docker exec backlogr ls -l /data/backlogr.db
      - name: Server logs
        if: always()
        run: docker logs backlogr || true
