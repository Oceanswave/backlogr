name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # GitHub-hosted only: this is a public repository, so pull requests from forks must never reach a self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -q -e '.[test]' shellcheck-py
      - name: Shellcheck
        run: shellcheck scripts/*.sh ensure.sh
      - name: Compile
        run: python -m py_compile cli.py core.py server.py dashboard.py
      - name: Tests
        run: python -m pytest -q tests
      - name: No legacy names
        run: |
          if grep -rnE 'TASKS?_(DB|PORT|HOSTS|TOKEN|URL|EXPORT|BACKUP)|task-manager|Task Manager|bot-team-tasks|/workspace/|/cursor/stores' --include='*.py' --include='*.sh' --include='*.service' --include='*.toml' --include='*.md' --include='*.example' --exclude=MIGRATION.md --exclude-dir=.github . ; then echo "legacy name found"; exit 1; fi
