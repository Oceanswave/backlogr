name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # GitHub-hosted only: this is a public repository, so pull requests from forks must never reach a self-hosted runner.
    uses: Oceanswave/github-workflows/.github/workflows/python-ci.yml@574bd0ee6560592261bd75132dd0fdb56b9e6711 # main
    with:
      runs-on: '"ubuntu-latest"'
      python-version: '3.12'
      install-args: -e .[test] shellcheck-py
      test-command: |
        shellcheck scripts/*.sh ensure.sh
        python -m py_compile cli.py core.py server.py dashboard.py
        python -m pytest -q tests
        if grep -rnE 'TASKS?_(DB|PORT|HOSTS|TOKEN|URL|EXPORT|BACKUP)|task-manager|Task Manager|bot-team-tasks|/workspace/|/cursor/stores' --include='*.py' --include='*.sh' --include='*.service' --include='*.toml' --include='*.md' --include='*.example' --exclude=MIGRATION.md --exclude-dir=.github . ; then echo "legacy name found"; exit 1; fi
