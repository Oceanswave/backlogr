name: PR auto-merge (green CI)
# If a same-repo PR passes CI, merge it. Calls the shared merge helper after CI
# completes on a same-repo pull request; the helper re-checks reviews, holds
# (draft, requested review, unresolved threads, changes requested), and that every
# check on the exact head is green before squash-merging. Fork PRs are never merged here.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: read
jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    uses: Oceanswave/github-workflows/.github/workflows/merge.yml@c66e0b30482ce34ccf65025ed85a4d06202c2dd3 # main
    with:
      runs-on: '["ubuntu-latest"]'
      head-branch: ${{ github.event.workflow_run.head_branch }}
      expected-head: ${{ github.event.workflow_run.head_sha }}
      required-checks: '[{"name":"test / Python CI","appId":15368}]'
