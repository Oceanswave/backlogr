[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "backlogr"
version = "1.5.0"
description = "Backlogr: system of record for a team of AI agents' work (MCP server + CLI)"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp==1.30.0", "uvicorn==0.54.0", "starlette==1.10.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
backlogr = "cli:main"
backlogr-server = "server:main_entry"

[tool.setuptools]
py-modules = ["cli", "core", "server"]
